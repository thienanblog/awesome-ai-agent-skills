# WordPress Docker Compose Template
# Generated by docker-local-dev skill
# Template variables: {{PROJECT_NAME}}, {{PHP_VERSION}}, {{DB_IMAGE}}, {{DB_PORT}}, etc.
# Note: No 'version' field needed - deprecated in Docker Compose v2

name: {{PROJECT_NAME}}

services:
  # WordPress Application with PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USERNAME:?set DB_USERNAME}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_DATABASE:?set DB_DATABASE}
      WORDPRESS_SECRET: ${WORDPRESS_SECRET:?set WORDPRESS_SECRET}
      WORDPRESS_DEBUG: '${WP_DEBUG:-1}'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', true);
    depends_on:
      db:
        condition: service_healthy
    networks:
      - {{PROJECT_NAME}}_network

  # Nginx Web Server
  nginx:
    image: {{NGINX_IMAGE}}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/wordpress.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - {{PROJECT_NAME}}_network

  # Database Server
  db:
    image: {{DB_IMAGE}}
    # Publish to loopback only when a host SQL client needs access:
    # ports:
    #   - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - {{PROJECT_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WP-CLI Container (for running WordPress commands)
  wpcli:
    image: {{WP_CLI_IMAGE}}
    profiles: ["tools"]
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - app
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DB_USERNAME:?set DB_USERNAME}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      WORDPRESS_DB_NAME: ${DB_DATABASE:?set DB_DATABASE}
    networks:
      - {{PROJECT_NAME}}_network
    entrypoint: ["wp", "--allow-root"]
    # Usage: docker compose run --rm wpcli <command>
    # Example: docker compose run --rm wpcli plugin list

  # Redis Cache (Optional - uncomment if needed)
  # redis:
  #   image: {{REDIS_IMAGE}}
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - {{PROJECT_NAME}}_network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # Email Testing (Optional - choose MailHog or Mailpit)
  mailpit:
    image: {{MAILPIT_IMAGE}}
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    networks:
      - {{PROJECT_NAME}}_network

  # phpMyAdmin (Optional - for database management)
  # phpmyadmin:
  #   image: {{PHPMYADMIN_IMAGE}}
  #   profiles: ["tools"]
  #   ports:
  #     - "127.0.0.1:${PMA_PORT:-8081}:80"
  #   environment:
  #     PMA_HOST: db
  #     PMA_USER: root
  #     PMA_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
  #   depends_on:
  #     - db
  #   networks:
  #     - {{PROJECT_NAME}}_network

networks:
  {{PROJECT_NAME}}_network:
    driver: bridge
    # For Nginx Proxy Manager or multi-project setups:
    # external: true
    # name: shared_network

volumes:
  db_data:
    driver: local
  # redis_data:
  #   driver: local
