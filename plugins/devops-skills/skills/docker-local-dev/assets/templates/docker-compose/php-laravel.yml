# Laravel Docker Compose Template
# Template markers: {{PROJECT_NAME}}, {{PHP_VERSION}}, {{DB_IMAGE}}, {{APP_PORT}}, {{DB_PORT}}
# Note: No 'version' field needed - deprecated in Docker Compose v2

name: {{PROJECT_NAME}}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - redis
    networks:
      - {{PROJECT_NAME}}_network

  nginx:
    image: {{NGINX_IMAGE}}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - {{PROJECT_NAME}}_network

  db:
    image: {{DB_IMAGE}}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    # Publish to loopback only when a host SQL client needs access:
    # ports:
    #   - "127.0.0.1:${DB_PORT:-3306}:3306"
    networks:
      - {{PROJECT_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: {{REDIS_IMAGE}}
    volumes:
      - redis_data:/data
    networks:
      - {{PROJECT_NAME}}_network

  mailpit:
    image: {{MAILPIT_IMAGE}}
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    networks:
      - {{PROJECT_NAME}}_network

  # Uncomment for queue workers
  # worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   command: php artisan queue:work --sleep=3 --tries=3
  #   volumes:
  #     - ./:/var/www
  #   depends_on:
  #     - db
  #     - redis
  #   networks:
  #     - {{PROJECT_NAME}}_network

networks:
  {{PROJECT_NAME}}_network:
    driver: bridge

volumes:
  db_data:
  redis_data:
