# Drupal Docker Compose Template
# Generated by docker-local-dev skill
# Template variables: {{PROJECT_NAME}}, {{PHP_VERSION}}, {{DB_IMAGE}}, {{DB_PORT}}, etc.
# Note: No 'version' field needed - deprecated in Docker Compose v2

name: {{PROJECT_NAME}}

services:
  # Drupal Application with PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DRUPAL_DB_HOST: db
      DRUPAL_DB_PORT: 3306
      DRUPAL_DB_NAME: ${DB_DATABASE:?set DB_DATABASE}
      DRUPAL_DB_USER: ${DB_USERNAME:?set DB_USERNAME}
      DRUPAL_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - {{PROJECT_NAME}}_network

  # Nginx Web Server
  nginx:
    image: {{NGINX_IMAGE}}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/drupal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - {{PROJECT_NAME}}_network

  # Database Server (MySQL/MariaDB or PostgreSQL)
  db:
    image: {{DB_IMAGE}}
    # Publish to loopback only when a host SQL client needs access:
    # ports:
    #   - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - {{PROJECT_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Drush Container (for running Drupal commands)
  drush:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    environment:
      DRUPAL_DB_HOST: db
      DRUPAL_DB_PORT: 3306
      DRUPAL_DB_NAME: ${DB_DATABASE:?set DB_DATABASE}
      DRUPAL_DB_USER: ${DB_USERNAME:?set DB_USERNAME}
      DRUPAL_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    networks:
      - {{PROJECT_NAME}}_network
    entrypoint: ["./vendor/bin/drush"]
    # Usage: docker compose run --rm drush <command>
    # Example: docker compose run --rm drush status

  # Redis Cache (Optional - uncomment if needed)
  # redis:
  #   image: {{REDIS_IMAGE}}
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - {{PROJECT_NAME}}_network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # Email Testing
  mailpit:
    image: {{MAILPIT_IMAGE}}
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    networks:
      - {{PROJECT_NAME}}_network

networks:
  {{PROJECT_NAME}}_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  # redis_data:
  #   driver: local
