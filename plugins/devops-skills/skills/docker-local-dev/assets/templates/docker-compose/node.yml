# Node.js Docker Compose Template
# Generated by docker-local-dev skill
# Supports: Express, NestJS, Fastify, Next.js
# Template variables: {{PROJECT_NAME}}, {{NODE_VERSION}}, {{DB_IMAGE}}, etc.
# Note: No 'version' field needed - deprecated in Docker Compose v2

name: {{PROJECT_NAME}}

services:
  # Node.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: {{DB_PORT_INTERNAL}}
      DB_NAME: ${DB_DATABASE:?set DB_DATABASE}
      DB_USER: ${DB_USERNAME:?set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - {{PROJECT_NAME}}_network
    # For development with hot reload:
    command: npm run dev

  # Nginx Reverse Proxy (Optional - for production-like setup)
  nginx:
    image: {{NGINX_IMAGE}}
    profiles: ["proxy"]
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/node-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - {{PROJECT_NAME}}_network

  # Database Server (MySQL/MariaDB)
  db:
    image: {{DB_IMAGE}}
    # Publish to loopback only when a host SQL client needs access:
    # ports:
    #   - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - {{PROJECT_NAME}}_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Alternative (uncomment if using PostgreSQL)
  # db:
  #   image: {{POSTGRES_IMAGE}}
  #   # Publish to loopback only when a host SQL client needs access:
  #   # ports:
  #   #   - "127.0.0.1:${DB_PORT:-5432}:5432"
  #   environment:
  #     POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE}
  #     POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME}
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
  #   volumes:
  #     - db_data:/var/lib/postgresql/data
  #   networks:
  #     - {{PROJECT_NAME}}_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Redis Cache
  redis:
    image: {{REDIS_IMAGE}}
    volumes:
      - redis_data:/data
    networks:
      - {{PROJECT_NAME}}_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Email Testing
  mailpit:
    image: {{MAILPIT_IMAGE}}
    ports:
      - "127.0.0.1:${MAIL_UI_PORT:-8025}:8025"
    networks:
      - {{PROJECT_NAME}}_network

  # Scheduler (Optional; prefer a direct foreground project command)
  # scheduler:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   init: true
  #   working_dir: /app
  #   volumes:
  #     - ./:/app
  #     - /app/node_modules
  #   environment:
  #     NODE_ENV: development
  #   depends_on:
  #     - db
  #     - redis
  #   networks:
  #     - {{PROJECT_NAME}}_network
  #   command: ["node", "scripts/cron.js"]

networks:
  {{PROJECT_NAME}}_network:
    driver: bridge
    # For multi-project or microservices:
    # external: true
    # name: shared_network

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  node_modules:
    driver: local
